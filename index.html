<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תחרות הדייג 2026</title>
<meta name="theme-color" content="#0B2E3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --deep:#0B2E3C; --sea:#145566; --tide:#2B8A94; --spray:#9FD3D6;
  --foam:#F2F6F4; --card:#FFFFFF; --ink:#0B2E3C; --muted:#5B7580; --rule:#D5E2E1; --soft:#E8F0EF;
  --buoy:#EE4B2B; --sun:#F5C84C; --ok:#1F8A5B;
  --gold:#D9A520; --silver:#9AA6AE; --bronze:#B06A35;
  --seg1:#0B2E3C; --seg2:#2B8A94; --seg3:#F5C84C;
  --bg:var(--foam);
  --r-lg:18px; --r-md:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --foam:#0A1F28; --card:#10303C; --ink:#E8F1F0; --muted:#8FAAB1; --rule:#1E4452; --soft:#163C49; --bg:#0A1F28; --seg1:#9FD3D6;
  }
}
:root[data-theme="dark"]{--foam:#0A1F28; --card:#10303C; --ink:#E8F1F0; --muted:#8FAAB1; --rule:#1E4452; --soft:#163C49; --bg:#0A1F28; --seg1:#9FD3D6;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Rubik",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
